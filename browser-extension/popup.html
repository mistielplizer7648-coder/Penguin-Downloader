<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;width:430px;margin:0;background:#f6f7f9;color:#20252b}.head{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700}.sub{font-size:11px;font-weight:400;color:#637180;margin-top:4px}.status{font-size:12px;font-weight:400;margin-top:5px}.ok{color:#168447}.bad{color:#c23b32}.tools{padding:10px 12px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}button{padding:7px 11px;border:1px solid #c8cdd2;border-radius:8px;background:#fff;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.08)}button.primary{background:#1677d2;color:white;border-color:#1677d2}.list{max-height:460px;overflow:auto}.item{padding:9px 12px;background:white;border-bottom:1px solid #eceff1}.url{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4b647b;margin-top:2px}.name{font-size:12px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;justify-content:space-between;gap:8px}.toggle{margin-left:auto;font-size:12px}
</style></head><body>
<div class="head">Penguin Downloader 3.0 Turbo<div class="sub">页面链接 + 真实网络响应嗅探</div><div id="status" class="status">正在检测本机程序…</div></div>
<div class="tools"><button id="page" class="primary">下载当前页面</button><button id="refresh">重新嗅探</button><label class="toggle"><input id="intercept" type="checkbox"> 自动接管下载</label></div>
<div id="list" class="list"></div>
<script src="popup.js"></script></body></html>
